<style>
:root{color-scheme:light;--ink:#222b35;--muted:#62594e;--red:#943a37;--paper:#fff8e9;--navy:#151f31;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #eba63c;outline-offset:3px}button{border:0}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}main{max-width:970px;margin:0 auto;min-height:100vh;display:grid;grid-template-columns:44% minmax(0,1fr);align-content:center;padding:32px 20px}
figure{position:relative;isolation:isolate;min-height:620px;background:#263955;overflow:hidden;border-radius:24px 0 0 24px;margin:0}figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;z-index:-3}figure::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#08142577 0%,transparent 32%,transparent 63%,#09121def 100%);z-index:-2}figcaption{position:absolute;left:24px;right:24px;bottom:27px;color:#fff9e5;text-shadow:0 2px 5px #0e1c25}figcaption h1{font:700 clamp(30px,4.5vw,49px)/1.15 "Songti SC","SimSun",serif;margin:0 0 9px}figcaption p{margin:0;color:#fff1d3;font-size:15px}.meter{position:absolute;right:23px;top:18%;height:50%;width:2px;background:#fff2bd72;border-radius:100px}.orb{width:17px;height:17px;border-radius:50%;box-shadow:0 0 10px #fff4a2,0 0 20px #ffdc46;position:absolute;bottom:0;left:50%;transform:translate(-50%,50%);background:radial-gradient(circle at 30% 25%,#fffce9,#ffdf84 35%,#c07024 80%);transition:bottom .5s}
.content{padding:clamp(22px,4vw,44px);background:var(--paper);border-radius:0 24px 24px 0;display:flex;flex-direction:column;justify-content:center;min-width:0}.top{align-items:center;display:flex;gap:6px;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:17px}.top b{color:var(--red)}h2{font-family:"Songti SC","SimSun",serif;font-size:clamp(23px,3.3vw,35px);line-height:1.3;margin:10px 0 14px;overflow-wrap:anywhere}p{line-height:1.55;margin:6px 0 15px;overflow-wrap:anywhere}.sub,.help{font-size:14px;color:var(--muted)}.actions{display:grid;gap:9px;margin:16px 0}.options{display:grid;gap:9px}.option,.primary,.secondary,.soft{border-radius:12px;padding:11px 15px;min-height:46px;font-weight:600;width:100%}.option{display:flex;align-items:center;gap:12px;background:#fffdf7;border:1px solid #d9c9ad;text-align:left;color:var(--ink)}.option b{border:1px solid #dfd1b9;border-radius:50%;width:28px;height:28px;line-height:26px;text-align:center;color:var(--red);flex:none;font:600 16px/26px Georgia,serif}.option[aria-pressed=true]{background:#f9e6c7;border:2px solid #9e5b32;padding:10px 14px}.primary{background:var(--red);color:#fff}.secondary{border:1px solid #ab8a62;background:#fffaf0;color:#633c25}.soft{background:transparent;color:#62412c;text-decoration:underline;text-underline-offset:4px;min-height:40px}.bar{display:flex;gap:4px;margin-bottom:17px}.bar i{height:4px;flex:1;border-radius:4px;background:#e4d5ba}.bar .on{background:var(--red)}details{border-top:1px solid #dacbb3;margin-top:15px;padding:12px 0}summary{cursor:pointer;color:#70452c;padding:5px 0;font-weight:600}#tools{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 15px;margin-top:14px;border-top:1px solid #dfd0b6;padding-top:10px}#tools button{width:auto;padding:8px 2px}.field{display:block;font-weight:650;margin:10px 0;font-size:15px}input,textarea{display:block;color:var(--ink);background:#fffdf8;border:1px solid #ceb99a;border-radius:9px;width:100%;margin-top:6px;padding:10px;min-height:43px}textarea{resize:vertical;min-height:82px;word-break:break-all}.score{font:700 54px/1 Georgia,serif;color:var(--red);margin:14px 0}.review{padding-left:24px}.review li{margin:0 0 14px}.review small{display:block;margin-top:5px;font-size:14px;color:var(--muted)}.notice{color:#84382d;font-weight:600;font-size:14px}#msg:empty{display:none}.qnav{display:flex;justify-content:space-between;gap:8px;margin:10px 0}.qnav button{width:auto;min-height:38px;padding:8px 12px}.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:9px 0}.pick button{position:relative;min-height:38px;border:1px solid #d7c8af;color:#584538;background:#fffbf3;border-radius:7px}.pick .chosen{background:#eaddc1;color:#4f3e21;border-color:#b99855}.pick .active{box-shadow:inset 0 0 0 2px var(--red)}.badge{font-size:14px;color:var(--red);font-weight:700}.progress-label{white-space:nowrap}
@media(max-width:660px){main{display:block;padding:0;min-height:100vh;background:var(--paper)}figure{border-radius:0;height:clamp(146px,24svh,210px);min-height:0}figure img{object-position:50% 43%}figcaption{left:max(17px,env(safe-area-inset-left));bottom:13px}figcaption h1{font-size:26px;margin-bottom:3px}figcaption p{font-size:13px}.meter{right:22px;top:16%;height:65%}.content{border-radius:0;padding:18px max(17px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(17px,env(safe-area-inset-left));justify-content:flex-start}.top{margin-bottom:8px}.bar{margin-bottom:10px}h2{margin:8px 0 13px;font-size:23px}.actions{margin:12px 0}.options{gap:7px}.option{min-height:43px;padding:8px 12px}.option[aria-pressed=true]{padding:7px 11px}.pick{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function topBar(title,right){const line=node('div',null,'top');line.append(node('b',title),node('span',right,'progress-label'));ui.append(line);}
function heading(text){const h=node('h2',text);ui.append(h);return h;}
function row(...buttons){const el=node('div',null,'actions');el.append(...buttons);ui.append(el);}
function navButton(label,fn){nav.append(button(label,fn,'soft'));}
function field(label,id,control){
 const l=node('label',label,'field');l.htmlFor=id;control.id=id;l.append(control);ui.append(l);
}
function safeDecode(raw){
 let code=String(raw??'').trim();
 if(code.includes('#wish=')) code=code.slice(code.lastIndexOf('#wish=')+6);
 if(!/^WT1\.[A-Za-z0-9_-]{1,220}$/.test(code))throw Error('挑战码无效，请完整复制朋友发来的挑战码。');
 const bytes=atob(code.slice(4).replace(/-/g,'+').replace(/_/g,'/'));
 const data=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(bytes,c=>c.charCodeAt(0))));
 if(!Array.isArray(data)||data.length!==2||typeof data[0]!=='string'||!data[0].trim()||Array.from(data[0]).length>20||/[\u0000-\u001f\u007f]/.test(data[0])||!Array.isArray(data[1])||data[1].length!==10||data[1].some(v=>!Number.isInteger(v)||v<0||v>=QUESTION_BANK.length*4)||new Set(data[1].map(v=>Math.floor(v/4))).size!==10)throw Error('题目数据不完整，请让朋友重新导出。');
 return {name:data[0].trim(), packed:data[1], code};
}
function encode(name,pairs){
 const bytes=new TextEncoder().encode(JSON.stringify([name,pairs]));
 return 'WT1.'+btoa(Array.from(bytes,b=>String.fromCharCode(b)).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function invitationURL(code){
 if(!['https:','http:'].includes(location.protocol))return '';
 const url=new URL(location.href);url.hash='wish='+code;return url.href;
}
function fillProgress(n){
 document.getElementById('orb').style.bottom=String(n*10)+'%';
 const bar=node('div',null,'bar');bar.setAttribute('aria-hidden','true');
 for(let i=0;i<10;i++)bar.append(node('i',null,i<n?'on':''));
 ui.append(bar);
}
function begin(invite=null){
 active=invite;questions=invite?invite.packed.map(v=>({...QUESTION_BANK[Math.floor(v/4)],correct:v%4})):trivial;answers=[];picked=null;
 renderRound();
}
function topic(){return active?active.name+'的默契挑战':'圣诞小知识';}
function options(q,selected,fn){
 const group=node('div',null,'options');
 q.options.forEach((word,i)=>{
  const el=button('',()=>fn(i),'option');
  el.setAttribute('aria-pressed',String(selected===i));
  el.append(node('b',letters[i]),node('span',word));group.append(el);
 });
 ui.append(group);return group;
}
function gameNav(){
 navButton('我来出题',openEditor);navButton('输入好友挑战码',openImport);
}
function renderRound(){
 const i=answers.length,q=questions[i];
 reset('play',active?'猜猜朋友亲自选了哪些答案。':'十道题，点亮树顶的星星。');
 topBar(topic(),'第 '+(i+1)+' / 10 题'); fillProgress(i);heading(q.question);
 const confirm=button(i===9?'查看成绩':'下一题',()=>{
  if(mode!=='play'||picked===null)return;
  answers.push(picked);picked=null;
  if(answers.length===10)result();else renderRound();
 },'primary');
 const group=options(q,picked,choice=>{
  picked=choice;[...group.children].forEach((c,k)=>c.setAttribute('aria-pressed',String(k===choice)));confirm.disabled=false;
 });
 confirm.disabled=picked===null;row(confirm);gameNav();
}
function result(){
 reset('result','你已把光点送到了树顶。');topBar(topic(),'已完成');fillProgress(10);heading('树顶的星星亮了！');
 const score=answers.reduce((sum,a,i)=>sum+Number(a===questions[i].correct),0);
 ui.append(node('p',score+' / 10','score'),node('p',active?'你猜中了 '+score+' 个属于 '+active.name+' 的答案。':'你答对了 '+score+' 道圣诞小知识。'));
 const detail=node('details'),list=node('ol',null,'review');
 detail.append(node('summary','查看每道题的答案'));
 questions.forEach((q,i)=>{const li=node('li',q.question);li.append(node('small','你选了「'+q.options[answers[i]]+'」'+(answers[i]===q.correct?' · 答对了':' · '+(active?'好友的选择':'正确答案')+'是「'+q.options[q.correct]+'」')));list.append(li);});
 detail.append(list);ui.append(detail);
 row(button('我也来出一份题',openEditor,'primary'),button('再玩一次',()=>begin(active)));
 navButton('输入好友挑战码',openImport);
}
function openEditor(){reset('editor','亲自选出十道题，看看谁最了解你。');
 topBar('出一份好友挑战','20 选 10');heading('写给朋友的十道题');
 const name=node('input');name.type='text';name.maxLength=20;name.value=owner;name.autocomplete='nickname';name.placeholder='朋友认得的名字';
 name.oninput=()=>{owner=name.value};field('你的昵称','owner',name);
 ui.append(node('p','点题号挑题，再选一个最像你的答案。已选的题号会出现星星。','sub'));
 const pick=node('div',null,'pick');pick.setAttribute('aria-label','挑选题目');
 QUESTION_BANK.forEach((q,i)=>{
  const has=selections.has(i);const el=button((has?'★ ':'')+(i+1),()=>{cursor=i;openEditor();},(has?'chosen ':'')+(i===cursor?'active':''));
  el.setAttribute('aria-label','题目 '+(i+1)+(has?' 已选':''));el.setAttribute('aria-pressed',String(i===cursor));
  pick.append(el);
 });ui.append(pick);
 const n=selections.size;ui.append(node('p','已选 '+n+' / 10 道','badge'));
 const q=QUESTION_BANK[cursor];heading(q.question);
 options(q,selections.get(cursor),i=>{
  if(!selections.has(cursor)&&n===10){status.textContent='已选满十题，可先点一颗星，取消那道题再换入新题。';return;}
  selections.set(cursor,i);
  if(selections.size<10){
   for(let d=1;d<=20;d++){const next=(cursor+d)%20;if(!selections.has(next)){cursor=next;break;}}
  }
  openEditor();
 });
 const controls=node('div',null,'qnav');
 controls.append(button('换一题',()=>{cursor=(cursor+1)%20;openEditor();}));
 if(selections.has(cursor))controls.append(button('移除本题',()=>{selections.delete(cursor);openEditor();},'soft'));ui.append(controls);
 const create=button('生成我的挑战',()=>{
  const clean=owner.trim();
  if(!clean){status.textContent='先写下你的昵称。';name.focus();return;}
  try{
   personal=safeDecode(encode(clean,[...selections].map(([idx,a])=>idx*4+a)));shareScreen();
  }catch(e){status.textContent='无法生成邀请，请检查昵称和题目。';}
 },'primary');create.disabled=n!==10;row(create);navButton('返回答题',resume);
}
function resume(){if(answers.length===10)result();else renderRound();}
function clip(value,input){
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(()=>{status.textContent='已复制。';},()=>manualCopy(input));return;}
 }catch{}
 manualCopy(input);
}
function manualCopy(input){input.focus();input.select();try{if(document.execCommand('copy')){status.textContent='已复制。';return;}}catch{}status.textContent='内容已选中，长按或按 Ctrl+C 复制。';}
function downloadInvite(code){
 const copy=source.cloneNode(true);copy.querySelector('#saved-invite').textContent=JSON.stringify(code);
 const data=new Blob(['<!doctype html>\n',copy.outerHTML],{type:'text/html;charset=utf-8'});
 const url=URL.createObjectURL(data),a=node('a');a.href=url;a.download='圣诞树好友挑战.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),45000);
}
function shareScreen(){
 reset('share','把这一份挑战送给朋友。');topBar('好友挑战','10 道题');heading('你的邀请准备好了');
 ui.append(node('p',personal.name+'，你的朋友可以答这十道题了。'));
 const url=invitationURL(personal.code);
 if(url){
  const link=node('textarea');link.readOnly=true;link.value=url;field('发给朋友的链接','public-link',link);
  row(button('复制邀请链接',()=>clip(url,link),'primary'));
 }
 const code=node('textarea');code.value=personal.code;code.readOnly=true;field('好友挑战码','challenge-code',code);
 ui.append(node('p','朋友也可以在同款游戏里点“输入好友挑战码”，或者用浏览器打开你导出的游戏文件。','help'));
 row(button('复制挑战码',()=>clip(personal.code,code),url?'secondary':'primary'),button('下载给朋友的游戏文件',()=>downloadInvite(personal.code)));
 navButton('试玩这份题',()=>begin(personal));navButton('修改题目',openEditor);
}
function openImport(){
 reset('import','打开朋友给你的圣诞邀请。');topBar('好友邀请','10 道题');heading('输入好友挑战码');
 const input=node('textarea');input.placeholder='粘贴 WT1. 开头的码或完整邀请链接';input.maxLength=1700;field('好友挑战码或邀请链接','incoming',input);
 row(button('打开挑战',()=>{try{begin(safeDecode(input.value));}catch{status.textContent='挑战码无效，请完整复制朋友发来的码或邀请链接。';}},'primary'));
 navButton('返回答题',resume);
}
const fileValue=document.getElementById('saved-invite').textContent;
function openInitial(){
 try{
  const own=JSON.parse(fileValue);
  if(location.hash.startsWith('#wish=')){begin(safeDecode(location.hash.slice(6)));return;}
  if(own){begin(safeDecode(own));return;}
  begin();
 }catch{begin();openImport();status.textContent='这份邀请不完整，请粘贴朋友发来的完整挑战码。';}
}
openInitial();window.addEventListener('hashchange',openInitial);

</script></body></html>
